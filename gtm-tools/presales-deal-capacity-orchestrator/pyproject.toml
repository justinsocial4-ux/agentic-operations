[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presales-deal-capacity-orchestrator"
version = "0.0.1"
description = "Local-first, recommendation-only presales orchestration prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "httpx==0.28.1",
  "ortools==9.15.6755",
  "pydantic==2.13.4",
  "streamlit==1.60.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.161.1",
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
